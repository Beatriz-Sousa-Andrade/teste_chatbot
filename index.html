<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquivo X | Central de Investigação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrapper">
        <aside class="sidebar">
            <div class="logo">
                <h2>📁 Arquivo X</h2>
            </div>
            <nav class="controles">
                <button id="iniciarBtn" class="btn-primary">Iniciar Sessão</button>
                <button id="limparBtn" class="btn-secondary">Limpar Histórico</button>
                <button id="encerrarBtn" class="btn-danger">Encerrar Sessão</button>
            </nav>
            <div class="status-panel">
                <p>Status da Conexão:</p>
                <div id="connection-status" class="status-offline">Offline</div>
            </div>
        </aside>

        <main class="chat-main">
            <header class="chat-header">
                <h1>Interface de Consulta Paranormal</h1>
            </header>
            <div id="chat-box" class="chat-box">
                <div class="message bot-message">
                    <strong>Sistema:</strong> Digite um comando ou tema para iniciar uma consulta ao banco de dados sobrenatural.
                </div>
            </div>
            <footer class="chat-input-area">
                <input type="text" id="message-input" placeholder="Investigar lenda, avistamento, ocultismo...">
                <button id="send-button">Enviar</button>
            </footer>
        </main>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
